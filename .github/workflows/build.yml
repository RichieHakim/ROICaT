name: build

on:
  push:
    # branches: [ "main" ]
    branches: [ "dev" ]
    # branches: [ "main", "dev" ]
  pull_request:
    # branches: [ "main" ]
    # branches: [ "dev" ]
    # branches: [ "main", "dev" ]
  workflow_dispatch:
    inputs:
      name:
        description: 'description'
        required: false
        default: ''

permissions:
  contents: read

jobs:

  build:

    name: ${{ matrix.platform }}, py${{ matrix.python-version }}, ${{ matrix.extra }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [
          ubuntu-latest,
          ubuntu-24.04,
          ubuntu-22.04,
          windows-latest,
          windows-2022,
          # windows-2019,
          macos-latest,
          macos-14,
        ]
        python-version: [
          # "3.8",
          # "3.9",
          # "3.10",
          # "3.11",
          "3.12",
          "3.13",
          "3.14",
        ]
        extra: [
          ## `dev` and `dev_latest` are `core` / `latest` plus the test tooling,
          ## so the matrix covers both dependency families.
          dev,
          dev_latest,
        ]

    steps:

    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: latest
        activate-environment: ROICaT
        auto-activate-base: true
        auto-update-conda: false
        remove-profiles: true
        architecture: x64
        clean-patched-environment-file: true
        run-post: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Prepare PowerShell
      shell: pwsh
      run: |
          conda info
          conda list

    - name: Check specs of the machine -- Linux
      if: startsWith(matrix.platform, 'ubuntu')
      run: |
        ## check cpu, memory, disk, etc.
        ## print the command inputs to the workflow
        echo "CPU info (lscpu):"
        lscpu
        echo "Memory info (free -h):"
        free -h
        echo "Disk info (df -h):"
        df -h
        echo "Network info (ip a):"
        ip a
        echo "OS info (uname -a):"
        uname -a
    - name: Check specs of the machine -- Windows
      if: startsWith(matrix.platform, 'windows')
      run: |
        ## check cpu, memory, disk, etc.
        ## just do a generic check on system info
        ## print the command inputs to the workflow
        echo "System info (systeminfo):"
        systeminfo
    - name: Check specs of the machine -- MacOS
      if: startsWith(matrix.platform, 'macos')
      run: |
        ## check cpu, memory, disk, etc.
        ## print the command inputs to the workflow
        echo "CPU info (sysctl -n machdep.cpu.brand_string):"
        sysctl -n machdep.cpu.brand_string
        echo "Memory info (sysctl -n hw.memsize):"
        sysctl -n hw.memsize
        echo "Disk info (df -h):"
        df -h
        echo "OS info (uname -a):"
        uname -a


    - name: Install repo with pip dependencies
      run: |
        pip install -v -e .[${{ matrix.extra }}]


    - name: Check installed packages
      run: |
        pip list
        ## Below, check which versions of torch and torchvision are installed; and whether CUDA is available
        python -c "import torch, torchvision; print(f'Using versions: torch=={torch.__version__}, torchvision=={torchvision.__version__}');  print('torch.cuda.is_available() = ', torch.cuda.is_available())"

    ## Cache the tracking ROInet weights between runs, so that an outage at the
    ## hosting sites does not fail the integration tests. The key holds the
    ## file's MD5. Saving is a separate step so that it happens even if the
    ## tests fail.
    - name: Restore ROInet weights from cache
      id: cache-roinet
      uses: actions/cache/restore@v4
      with:
        path: ~/roicat_ci_cache/ROInet.zip
        key: roinet-tracking-7a5fb8ad94b110037785a46b9463ea94-${{ runner.os }}

    - name: Put ROInet weights in the temp directory
      run: |
        python .github/scripts/prepare_roinet_ci.py

    - name: Save ROInet weights to cache
      if: steps.cache-roinet.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/roicat_ci_cache/ROInet.zip
        key: ${{ steps.cache-roinet.outputs.cache-primary-key }}

    - name: Run pytest and generate coverage report
      run: |
        pip install pytest pytest-cov
        python -m pytest tests/ -v -rP --capture=tee-sys --cov=roicat --cov-report=xml:coverage.xml --color=yes

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4  ## this is a public action recognized by GitHub Actions
      with:
        token: ${{ secrets.CODECOV_TOKEN }}  ## this is a secret variable
        file: coverage.xml  ## this is the default name of the coverage report file
        fail_ci_if_error: false
        verbose: true
