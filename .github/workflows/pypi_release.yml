name: Publish Python 🐍 distribution 📦 to PyPI

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'description'     
        required: false                     
        default: '' 
jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pypa/build
      run: >-
        python3 -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
        
  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    # if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/roicat  # Replace <package-name> with your PyPI project name
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - uses: actions/checkout@v4
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      ## Pinned to a commit rather than a tag so the installed code cannot
      ## change under us. v3.0.0 asked for `sigstore ~= 3.0` and so installed
      ## whatever was newest in that line; when Sigstore rotated its TUF root in
      ## August 2026 the root embedded in sigstore-python 3.x stopped verifying
      ## and signing failed with "root was signed by 0/3 keys", breaking the
      ## 1.7.8 release. v3.5.0 pins sigstore==4.5.0 and tuf==7.0.0 exactly.
      uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: List files in workspace
      run: >-
        ls ${{ github.workspace }}
    - name: List files in upper directory
      run: >-
        ls ${{ github.workspace }}/..
    - name: List files in dist
      run: >-
        ls ${{ github.workspace }}/dist    
    - name: Store the version number
      run: |
        version=$(grep '__version__' ${{ github.workspace }}/roicat/__init__.py | awk -F = '{print $2}' | tr -d ' ' | tr -d \"\')
        echo "VERSION=$version" >> $GITHUB_ENV
    - name: Check version number
      run: echo "Version is $VERSION"
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create "v$VERSION" 
        ./dist/* 
        --title "v$VERSION" 
        --notes "Release for version $VERSION. Also available on PyPI: https://pypi.org/project/roicat/$VERSION/"
        --repo ${{ github.repository }}